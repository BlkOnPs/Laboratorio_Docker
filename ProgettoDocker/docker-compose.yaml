#AVVIO CONTAINERS (MIGRATIONS & SEEDERS, APP NODE - crud_node, MYSQL - crud-mysql)

services:
  migrate:
    build: .
    image: crud-node:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: production
    #Migrations e seeders --> creazione tabelle + inserimento dati iniziali
    command: sh -c "npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all"
    restart: "no"

  app:
    build: . #Richiama tutti i Dockerfile presenti nel progetto
    container_name: crud-node
    #Nome container generato --> stack_servizio_numero
    #stack    --> nome cartella progetto, in questo caso "ProgettoDocker"
    #servizio --> in questo caso "app" o "db"
    #numero   --> contatore normale (inizia da 1)

    #Riavvio automatico se l'app si blocca
    restart: unless-stopped

    ports:
      #Porta HOST:CONTAINER
      - "${PORT}:5000"

    depends_on: #Dipendenza
      db:
        condition: service_healthy
        #L'app parte solo quando MySQL è pronto

      migrate:
        condition: service_completed_successfully
        #L'app parte solo quando migrations e seeders
        #sono terminati correttamente

    environment:
      PORT: 5000

      DB_HOST: db
      DB_PORT: 3306

      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      NODE_ENV: production

  db:
    image: mysql:8.4

    container_name: crud-mysql

    #Riavvio automatico se il db si blocca
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      #Persistenza dati --> se elimino il container senza questo volume, 
      #perderei tutti i dati del db
      - mysql-data:/var/lib/mysql

    healthcheck: #Controlla se MySQL è effettivamente pronto
      test: [
        "CMD-SHELL",
        "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"
      ]
      interval: 5s
      timeout: 5s
      retries: 15 #Dopo 15 tentativi falliti considera il servizio non "healthy"

volumes:
  #Dichiarazione volumi da montare al compose
  mysql-data: